apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikopbx-cf-pvc
  annotations:
    # the PV's reclaim policy is Delete: losing this PVC loses the PBX's data
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.cf.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mikopbx-storage-pvc
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.data.size }}

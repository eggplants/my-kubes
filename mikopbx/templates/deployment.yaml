apiVersion: apps/v1
kind: Deployment
metadata:
  name: mikopbx
spec:
  replicas: {{ .Values.replicaCount }}
  # the host's ports and the RWO volumes cannot be shared with a second pod during a rollout
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mikopbx
  template:
    metadata:
      labels:
        app: mikopbx
    spec:
      # Asterisk must see the node's own addresses (LAN and Tailscale) to put reachable
      # addresses in SDP. No NET_ADMIN: MikoPBX's firewall would rewrite the node's iptables
      # and cut off SSH and the k3s API, so it is left without effect.
      hostNetwork: true
      containers:
        - name: mikopbx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          tty: true
          env:
            - name: ID_WWW_USER
              value: {{ .Values.wwwUser.uid | quote }}
            - name: ID_WWW_GROUP
              value: {{ .Values.wwwUser.gid | quote }}
            - name: PBX_NAME
              value: {{ .Values.pbxConfig.name }}
            - name: SSH_PORT
              value: {{ .Values.pbxConfig.sshPort | quote }}
            - name: WEB_PORT
              value: {{ .Values.pbxConfig.webPort | quote }}
            - name: WEB_HTTPS_PORT
              value: {{ .Values.pbxConfig.httpsPort | quote }}
          volumeMounts:
            - name: cf
              mountPath: /cf
            - name: storage
              mountPath: /storage
      volumes:
        - name: cf
          persistentVolumeClaim:
            claimName: mikopbx-cf-pvc
        - name: storage
          persistentVolumeClaim:
            claimName: mikopbx-storage-pvc

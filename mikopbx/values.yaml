replicaCount: 1

image:
  repository: mikopbx/mikopbx
  tag: 2024.2.29-dev
  pullPolicy: IfNotPresent

wwwUser:
  uid: 1001
  gid: 1001

pbxConfig:
  name: "MikoPBX-on-K8s"
  sshPort: 23
  webPort: 8080
  httpsPort: 8443

# Published on the node with hostPort (the pod no longer uses the host network, so
# MikoPBX's firewall stays inside the pod). Keep these equal to MikoPBX's settings.
sip:
  port: 5060
  tlsPort: 5061
iaxPort: 4569
rtp:
  start: 10000
  end: 10800

storage:
  cf:
    path: /var/spool/mikopbx/cf
    size: 1Gi
  data:
    path: /var/spool/mikopbx/storage
    size: 10Gi

service:
  type: NodePort
  nodePorts:
    web: 30080
    https: 30443
    ssh: 30023

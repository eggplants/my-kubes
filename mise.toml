# Run on this Mac. `mise bootstrap remote` sends cluster/ to each Pi and runs `mise bootstrap` there.
# Each host's mise_env picks cluster/mise.server.toml or cluster/mise.agent.toml.
#
#   mise bootstrap remote --all --dry-run
#   mise bootstrap remote --all

[vars]
# Names come from RTX830 static DNS (home.arpa), not mDNS: the MikoPBX firewall on pi01 drops mDNS
server = "eggplants@pi01.home.arpa"
agents = "eggplants@pi02.home.arpa eggplants@pi03.home.arpa eggplants@pi04.home.arpa"
router = "192.168.100.1"

[bootstrap.remote]
source = "cluster"

[bootstrap.remote.hosts.pi01]
host = "pi01.home.arpa"
user = "eggplants"
tags = ["server"]
mise_env = ["server"]

[bootstrap.remote.hosts.pi02]
host = "pi02.home.arpa"
user = "eggplants"
tags = ["agent"]
mise_env = ["agent"]

[bootstrap.remote.hosts.pi03]
host = "pi03.home.arpa"
user = "eggplants"
tags = ["agent"]
mise_env = ["agent"]

[bootstrap.remote.hosts.pi04]
host = "pi04.home.arpa"
user = "eggplants"
tags = ["agent"]
mise_env = ["agent"]

[tasks."cluster:status"]
description = "Show the cluster's nodes"
run = "ssh {{ vars.server }} sudo k3s kubectl get nodes -o wide"

[tasks."cluster:argocd-password"]
description = "Print Argo CD's initial admin password, while argocd-initial-admin-secret still exists"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
ssh {{ vars.server }} "sudo k3s kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}'" | base64 -d
echo
'''

[tasks."cluster:grafana-password"]
description = "Print Grafana's generated admin password, which stops working once it is changed in the web UI"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
ssh {{ vars.server }} "sudo k3s kubectl -n monitoring get secret kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}'" | base64 -d
echo
'''

[tasks."cluster:ca"]
description = "Print the root certificate for each device to trust (e.g. mise run cluster:ca > home-ca.crt)"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
ssh {{ vars.server }} "sudo k3s kubectl -n cert-manager get secret home-ca -o jsonpath='{.data.ca\.crt}'" | base64 -d
'''

[tasks."cluster:discord-webhook"]
description = "Store the Discord webhook for Argo CD's notifications (asked for here, never printed or stored in this repository)"
quiet = true
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
read -rsp 'Discord webhook URL: ' url </dev/tty
echo
[[ "$url" == https://discord.com/api/webhooks/* ]] || { echo "cluster:discord-webhook: not a Discord webhook URL" >&2; exit 1; }
printf '%s' "$url" | ssh {{ vars.server }} 'sudo k3s kubectl -n argocd create secret generic argocd-notifications-secret --from-file=discord-webhook-url=/dev/stdin --dry-run=client -o yaml | sudo k3s kubectl apply -f -'
'''

[tasks."cluster:adguard-setup"]
description = "Create AdGuard Home's admin on the origin, once (asked for here, never printed or stored in this repository)"
quiet = true
raw = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
read -rsp 'AdGuard Home password for admin: ' password </dev/tty
echo
# the script and the password both go over stdin, which keeps the password out of pi01's process list
{ printf 'password=%q\n' "$password"; cat <<'EOF'; } | ssh {{ vars.server }} bash -s
set -euo pipefail
k() { sudo k3s kubectl -n adguard "$@"; }
if k get secret adguard-home-credentials >/dev/null 2>&1; then
  echo "cluster:adguard-setup: already set up; see adguard-home/README.md to rebuild the origin" >&2
  exit 1
fi
k wait --for=condition=Ready pod/adguard-home-0 --timeout=5m >/dev/null

printf '%s' "$password" |
  jq -Rs '{username: "admin", password: ., web: {ip: "0.0.0.0", port: 3000}, dns: {ip: "0.0.0.0", port: 53}}' |
  k exec -i adguard-home-0 -- wget -qO /dev/null --header=Content-Type:application/json --post-file=/dev/stdin http://127.0.0.1:3000/control/install/configure

printf '%s' "$password" |
  k create secret generic adguard-home-credentials --from-literal=username=admin --from-file=password=/dev/stdin --dry-run=client -o yaml |
  k apply -f - >/dev/null

# the first line is for read, and the rest stays on stdin for wget
dns_config() {
  printf 'admin:%s' "$password" | base64 -w0
  echo
  jq -n --arg router "{{ vars.router }}" '{upstream_dns: ["[/home.arpa/]\($router)", "https://dns10.quad9.net/dns-query"], local_ptr_upstreams: [$router]}'
}
# the web server restarts after the install
for _ in {1..15}; do
  if dns_config | k exec -i adguard-home-0 -- sh -c 'IFS= read -r auth; exec wget -qO /dev/null --header="Authorization: Basic $auth" --header=Content-Type:application/json --post-file=/dev/stdin http://127.0.0.1:3000/control/dns_config' 2>/dev/null; then
    echo "cluster:adguard-setup: done"
    exit 0
  fi
  sleep 2
done
echo "cluster:adguard-setup: admin is created, but home.arpa is not sent to the router; set it in the web UI" >&2
exit 1
EOF
'''

[tasks."cluster:token"]
description = "Copy pi01's join token to each agent's /etc/rancher/k3s/token (never printed or stored here)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
token="$(ssh {{ vars.server }} sudo cat /var/lib/rancher/k3s/server/node-token)"
for h in {{ vars.agents }}; do
  printf '%s\n' "$token" | ssh "$h" 'sudo install -D -m 600 /dev/stdin /etc/rancher/k3s/token'
  echo "cluster:token: $h"
done
'''

[tasks."cluster:reset"]
description = "Uninstall k3s from one agent and remove its node from the cluster (e.g. mise run cluster:reset pi02)"
usage = 'arg "<host>" help="pi02, pi03 or pi04"'
confirm = "Uninstall k3s from {{ usage.host }} (its data in /var/lib/rancher is deleted)?"
run = '''
#!/usr/bin/env bash
set -euo pipefail
h="{{ usage.host }}"
[[ "$h" =~ ^pi0[234]$ ]] || { echo "cluster:reset: only agents (pi02, pi03, pi04) can be reset" >&2; exit 1; }
ssh "eggplants@$h.home.arpa" 'for s in k3s-agent-uninstall.sh k3s-uninstall.sh; do [ ! -x /usr/local/bin/$s ] || sudo /usr/local/bin/$s; done'
# a node object left behind keeps the old node password, and the rejoin is refused
ssh {{ vars.server }} sudo k3s kubectl delete node "$h" --ignore-not-found
'''

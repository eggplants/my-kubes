apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.20.0
  targetNamespace: monitoring
  createNamespace: true
  valuesContent: |-
    # k3s runs these inside one process on pi01, listening only on 127.0.0.1, and its datastore is SQLite.
    # They would stay unscraped and fire TargetDown. That process's metrics, scraped as the apiserver, have most of theirs.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    # alerts still show at /alerts in Prometheus
    alertmanager:
      enabled: false
    defaultRules:
      rules:
        alertmanager: false
      # would fire forever without an Alertmanager
      disabled:
        PrometheusNotConnectedToAlertmanagers: true
    # the chart's 10s ignores prometheusSpec.scrapeInterval, and this is the scrape with the most series
    kubelet:
      serviceMonitor:
        cAdvisorInterval: 1m
        metricRelabelings:
          # from the chart's values, as this list replaces them
          - action: drop
            sourceLabels: [__name__, le]
            regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
          # pi01's kubelet serves the whole k3s process's metrics, which the apiserver job already has
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver|etcd|scheduler|workqueue)_.+
    grafana:
      defaultDashboardsTimezone: browser
      sidecar:
        datasources:
          alertmanager:
            enabled: false
      # its volume lives on one node, and pi02 and pi03 answer DNS
      nodeSelector:
        kubernetes.io/hostname: pi04
      persistence:
        enabled: true
        size: 1Gi
      # the old and new pods would share one SQLite file
      deploymentStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
      # the chart's default has -k, which would take these dashboards without checking grafana.com's certificate
      defaultCurlOptions: -sf
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: grafana-com
              folder: grafana.com
              type: file
              options:
                path: /var/lib/grafana/dashboards/grafana-com
      # downloaded each time the pod starts, so it stays in Init while grafana.com is out of reach
      dashboards:
        grafana-com:
          k8s-views-nodes-list:
            gnetId: 22153
            revision: 3
            datasource:
              - name: "DS_INFRASTRUCTURE_& PLATFORM METRICS"
                value: prometheus
          k8s-views-global:
            gnetId: 15757
            revision: 43
          k8s-views-namespaces:
            gnetId: 15758
            revision: 46
          k8s-views-nodes:
            gnetId: 15759
            revision: 40
          k8s-views-pods:
            gnetId: 15760
            revision: 41
      grafana.ini:
        server:
          root_url: https://grafana.home.arpa
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: home-ca
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        hosts:
          - grafana.home.arpa
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.home.arpa
    prometheus:
      prometheusSpec:
        # its volume lives on one node, and pi02 and pi03 answer DNS
        nodeSelector:
          kubernetes.io/hostname: pi04
        # twice the chart's interval, to go easier on the node's SD card
        scrapeInterval: 1m
        evaluationInterval: 1m
        retention: 15d
        retentionSize: 8GiB
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 1536Mi
    # pi01 already runs the control plane and MikoPBX
    prometheusOperator:
      affinity: &agents
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      admissionWebhooks:
        patch:
          affinity: *agents
    kube-state-metrics:
      affinity: *agents

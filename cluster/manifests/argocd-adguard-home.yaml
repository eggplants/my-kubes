# No resources-finalizer: deleting this Application must leave AdGuard Home running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard-home
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eggplants/my-kubes
    targetRevision: master
    path: adguard-home
    helm:
      releaseName: adguard-home
  destination:
    server: https://kubernetes.default.svc
    namespace: adguard
  syncPolicy:
    # no prune: something dropped from the chart stays until it is removed by hand
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

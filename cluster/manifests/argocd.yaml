apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.12.1
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      domain: pi01.home.arpa
      # pi01 already runs the control plane and MikoPBX
      affinity:
        nodeAffinity:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
    dex:
      enabled: false
    notifications:
      enabled: false
    applicationSet:
      replicas: 0
    configs:
      params:
        # Traefik terminates TLS
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: home-ca
          # HTTPS only: with server.insecure, the web entrypoint would serve the UI in plain HTTP
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        tls: true

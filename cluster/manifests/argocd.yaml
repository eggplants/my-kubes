apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.12.1
  targetNamespace: argocd
  createNamespace: true
  valuesContent: |-
    global:
      domain: pi01.home.arpa
      # pi01 already runs the control plane and MikoPBX
      affinity:
        nodeAffinity:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
    dex:
      enabled: false
    notifications:
      enabled: true
      # holds the webhook URL, which must stay out of this repository: mise run cluster:discord-webhook
      secret:
        create: false
      notifiers:
        service.webhook.discord: |
          url: $discord-webhook-url
          headers:
            - name: Content-Type
              value: application/json
      subscriptions:
        - recipients:
            - discord
          triggers:
            - on-deployed
            - on-health-degraded
            - on-sync-failed
      templates:
        template.app-deployed: |
          webhook:
            discord:
              method: POST
              body: |
                {"content": {{ printf "✅ %s deployed (%s)\n%s/applications/%s" .app.metadata.name (.app.status.operationState.syncResult.revision | trunc 7) .context.argocdUrl .app.metadata.name | toJson }}}
        template.app-health-degraded: |
          webhook:
            discord:
              method: POST
              body: |
                {"content": {{ printf "⚠️ %s is degraded\n%s/applications/%s" .app.metadata.name .context.argocdUrl .app.metadata.name | toJson }}}
        template.app-sync-failed: |
          webhook:
            discord:
              method: POST
              body: |
                {"content": {{ printf "❌ %s failed to sync: %s\n%s/applications/%s" .app.metadata.name (.app.status.operationState.message | trunc 1500) .context.argocdUrl .app.metadata.name | toJson }}}
      # from https://github.com/argoproj/argo-cd/blob/v3.6.1/notifications_catalog/install.yaml
      triggers:
        trigger.on-deployed: |
          - description: Application is synced and healthy. Triggered once per commit.
            oncePer: app.status.operationState?.syncResult?.revision
            send:
              - app-deployed
            when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
              and app.status.health.status == 'Healthy' and (!time.Parse(app.status.health.lastTransitionTime).Add(1
              * time.Minute).Before(time.Parse(app.status.operationState.finishedAt)) or time.Parse(app.status.health.lastTransitionTime).Before(time.Parse(app.status.operationState.startedAt)))
        trigger.on-health-degraded: |
          - description: Application has degraded
            oncePer: app.status.operationState?.syncResult?.revision
            send:
              - app-health-degraded
            when: app.status.health.status == 'Degraded'
        trigger.on-sync-failed: |
          - description: Application syncing has failed
            oncePer: app.status.operationState?.syncResult?.revision
            send:
              - app-sync-failed
            when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    applicationSet:
      replicas: 0
    configs:
      params:
        # Traefik terminates TLS
        server.insecure: true
    server:
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: home-ca
          # HTTPS only: with server.insecure, the web entrypoint would serve the UI in plain HTTP
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
        tls: true

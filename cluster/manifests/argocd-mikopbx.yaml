# No resources-finalizer: deleting this Application must leave MikoPBX running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mikopbx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/eggplants/my-kubes
    targetRevision: master
    path: mikopbx
    helm:
      releaseName: mikopbx
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    # no prune: something dropped from the chart stays until it is removed by hand
    automated:
      selfHeal: true

# pi01: k3s server (control plane). Runs MikoPBX.

[env]
K3S_ROLE = "server"

[bootstrap.packages]
"apt:jq" = "latest"

[bootstrap.files."/etc/rancher/k3s/config.yaml"]
content = """
flannel-iface: eth0
"""

# k3s applies whatever is in this directory. These run before k3s.sh, so a new server needs the directory made here.
[bootstrap.directories."/var/lib/rancher/k3s/server/manifests"]
owner = "root"
group = "root"
mode = "0700"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/system-upgrade-controller.yaml"]
source = "./manifests/system-upgrade-controller.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/system-upgrade-crd.yaml"]
source = "./manifests/system-upgrade-crd.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/system-upgrade-plans.yaml"]
source = "./manifests/system-upgrade-plans.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/cert-manager.yaml"]
source = "./manifests/cert-manager.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/cert-manager-issuers.yaml"]
source = "./manifests/cert-manager-issuers.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/argocd.yaml"]
source = "./manifests/argocd.yaml"
owner = "root"
group = "root"
mode = "0600"

[bootstrap.files."/var/lib/rancher/k3s/server/manifests/argocd-mikopbx.yaml"]
source = "./manifests/argocd-mikopbx.yaml"
owner = "root"
group = "root"
mode = "0600"

[tasks.bootstrap]
description = "Install k3s as the server, then sync MikoPBX's dialplan applications from dialplan/"
run = ["bash k3s.sh", "bash dialplan.sh"]

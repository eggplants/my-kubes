# Clients use these nodes' addresses as their DNS servers, so changing them means changing the router's DHCP too.
nodes:
  - pi02
  - pi03

storage:
  conf:
    size: 256Mi
  work:
    size: 5Gi

ingress:
  host: adguard.home.arpa

sync:
  image:
    repository: ghcr.io/bakito/adguardhome-sync
    tag: v0.9.6@sha256:157e509baeef66cd400dae96c955a1e97312670e0285a92ebe2c3465b3e22e67
    pullPolicy: IfNotPresent
  cron: "*/10 * * * *"

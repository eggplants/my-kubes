# The origin only: adguardhome-sync overwrites whatever is changed on the replica.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-home
  annotations:
    cert-manager.io/cluster-issuer: home-ca
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-home-origin
                port:
                  name: web
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: adguard-home-tls

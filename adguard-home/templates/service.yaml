apiVersion: v1
kind: Service
metadata:
  name: adguard-home
spec:
  clusterIP: None
  selector:
    app: adguard-home
  ports:
    - name: web
      port: 3000
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-origin
spec:
  selector:
    app: adguard-home
    statefulset.kubernetes.io/pod-name: adguard-home-0
  ports:
    - name: web
      port: 3000
      targetPort: web
